---
name: Publish AUR Package
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 0.10.0)"
        required: true
        type: string
      ref:
        description: "Git ref (branch/tag/commit) to checkout (optional, defaults to v<version>)"
        required: false
        type: string
      pkgrel:
        description: "Package release version (pkgrel) (optional, defaults to 1)"
        required: false
        default: "1"
        type: string
  workflow_run:
    workflows: ["Build and Release Binaries"]
    types: [completed]
permissions:
  contents: read
jobs:
  publish-aur:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'release')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || (github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.event.workflow_run.head_branch) }}

      - name: Get Version
        id: get_version
        # Event data goes through env, never into the script text. VERSION is
        # then interpolated (${{ env.VERSION }}) by later steps, so it has to
        # look like a version before it leaves this one.
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW_VERSION="$DISPATCH_VERSION"
          else
            RAW_VERSION="$RUN_TAG"
          fi
          VERSION="${RAW_VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid release version: '$VERSION'"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Resolved version: $VERSION"

      - name: Update PKGBUILD version
        env:
          PKGREL: ${{ github.event.inputs.pkgrel || '1' }}
        run: |
          case "$PKGREL" in
            ''|*[!0-9]*) echo "::error::pkgrel must be a number, got '$PKGREL'"; exit 1 ;;
          esac
          sed -i "s/^pkgver=.*/pkgver=${{ env.VERSION }}/" packaging/aur/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=$PKGREL/" packaging/aur/PKGBUILD
          cat packaging/aur/PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.2
        with:
          pkgname: hwaro
          pkgbuild: packaging/aur/PKGBUILD
          commit_username: hahwul
          commit_email: hahwul@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
