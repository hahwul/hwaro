---
name: Chocolatey Publish
# Publishes the versioned Windows .exe through Chocolatey after the release
# build has uploaded it. Dispatch supports backfills and a full pack/install
# dry run without pushing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.21.0)"
        required: true
        type: string
      dry_run:
        description: "Pack and smoke-test without pushing to Chocolatey"
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: ["Build and Release Binaries"]
    types: [completed]
permissions:
  contents: read
jobs:
  publish-package:
    name: Publish package to Chocolatey
    # Match the Homebrew/AUR publishers: only a successful release build has
    # the versioned assets this package needs; workflow_dispatch can backfill.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'release')
    runs-on: windows-latest
    steps:
      - name: Resolve version
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        shell: pwsh
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:DISPATCH_VERSION -replace '^v', ''
          } else {
            $version = $env:RUN_TAG -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: '$version'"
          }
          "VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Resolved version: $version"

      - name: Checkout package templates
        uses: actions/checkout@v6

      # The release ships no checksum file; GitHub records a SHA256 digest
      # for every uploaded asset. The smoke-test install below re-verifies it.
      - name: Read release asset digest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releaseTag = "v$env:VERSION"
          $assetName = "hwaro-v$env:VERSION-windows-x86_64.exe"
          $releaseJson = gh release view $releaseTag --repo hahwul/hwaro --json assets
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect release $releaseTag."
          }
          # The Windows build is continue-on-error, so a release can succeed
          # without its .exe; Chocolatey starts with the first release after v0.20.2.
          $asset = ($releaseJson | ConvertFrom-Json).assets | Where-Object { $_.name -eq $assetName }
          if (-not $asset) {
            throw "Release $releaseTag is missing Windows asset $assetName. Chocolatey publishing starts with the first release after v0.20.2."
          }
          if ($asset.digest -notmatch '^sha256:([0-9a-fA-F]{64})$') {
            throw "Release asset $assetName has no SHA256 digest (got '$($asset.digest)')."
          }
          "SHA256=$($Matches[1].ToLowerInvariant())" >> $env:GITHUB_ENV
          Write-Host "Found SHA256 for $assetName."

      - name: Render package files
        shell: pwsh
        run: |
          $utf8 = [Text.UTF8Encoding]::new($false)
          $nuspec = (Get-Content packaging/chocolatey/hwaro.nuspec.tmpl -Raw).Replace('__VERSION__', $env:VERSION)
          $install = (Get-Content packaging/chocolatey/tools/chocolateyinstall.ps1.tmpl -Raw).Replace('__VERSION__', $env:VERSION).Replace('__SHA256__', $env:SHA256)
          New-Item -ItemType Directory -Force -Path out/tools | Out-Null
          [IO.File]::WriteAllText((Join-Path $PWD 'out/hwaro.nuspec'), $nuspec, $utf8)
          [IO.File]::WriteAllText((Join-Path $PWD 'out/tools/chocolateyinstall.ps1'), $install, $utf8)
          Get-Content out/hwaro.nuspec
          Get-Content out/tools/chocolateyinstall.ps1

      - name: Pack Chocolatey package
        shell: pwsh
        run: |
          Push-Location out
          try {
            choco pack hwaro.nuspec --outputdirectory ..
            if ($LASTEXITCODE -ne 0) { throw 'choco pack failed.' }
          } finally {
            Pop-Location
          }

      - name: Smoke-test local package
        shell: pwsh
        run: |
          choco install hwaro --source . -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Local Chocolatey install failed.' }
          $text = (& hwaro --version 2>&1) -join "`n"
          $code = $LASTEXITCODE
          Write-Host $text
          if ($code -ne 0 -or $text -notmatch [regex]::Escape($env:VERSION)) {
            throw "hwaro --version did not print expected version $env:VERSION."
          }

      - name: Push package
        if: ${{ github.event_name == 'workflow_run' || inputs.dry_run != true }}
        env:
          CHOCOLATEY_KEY: ${{ secrets.CHOCOLATEY_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CHOCOLATEY_KEY)) {
            throw 'CHOCOLATEY_KEY is not configured.'
          }
          $out = choco push "hwaro.$env:VERSION.nupkg" --source https://push.chocolatey.org/ --api-key "$env:CHOCOLATEY_KEY" 2>&1
          $code = $LASTEXITCODE
          $text = $out -join "`n"
          Write-Host $text
          if ($code -ne 0) {
            # A re-run of a release already pushed is not a failure: the feed refuses a version twice.
            if ($text -match '409|already exists|Conflict') {
              Write-Host "hwaro $env:VERSION is already on Chocolatey; nothing to push."
            } else {
              throw 'Chocolatey package push failed.'
            }
          }

      - name: Report dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        shell: pwsh
        run: Write-Host "Dry run passed for hwaro $env:VERSION; package was not pushed."
